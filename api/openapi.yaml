openapi: 3.0.3
info:
  title: Usage Billing
  version: 0.3.0-dev
  description: Educational trusted-producer API. No real payments or tenant-level authorization.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /v1/events:
    post:
      operationId: acceptEvent
      summary: Accept a new event or replay immutable input
      description: JSON only, at most 16 KiB. Duplicate and unknown fields are rejected. New pricing must fit positive int64.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Input'
      responses:
        '202':
          description: Newly accepted event, processing may still be pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '200':
          description: Identical replay with original frozen price
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Same event ID with different customer, meter, or units
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body exceeds 16 KiB
        '415':
          description: Content-Type must be application/json
        '503':
          description: Pending queue is full. New event was not accepted; replay the same ID after backoff. Identical accepted replays remain available.
          headers:
            Retry-After:
              description: Minimum retry delay in seconds, not a guarantee of available capacity
              schema:
                type: integer
                example: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Failure'
  /v1/events/{event_id}:
    get:
      operationId: getEvent
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ID'
      responses:
        '200':
          description: Stored input and processing state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown event
        '500':
          $ref: '#/components/responses/Failure'
  /v1/events/{event_id}/retry:
    post:
      operationId: retryEvent
      summary: Reactivate one failed generation without repricing
      description: Uses the existing trusted-producer token. Failed work retains its admission slot. Resend the same generation after a lost response; do not automatically advance it on conflict. JSON only, at most 16 KiB, duplicate and unknown fields rejected.
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [retry_generation]
              properties:
                retry_generation:
                  type: integer
                  format: int64
                  minimum: 0
                  maximum: 9223372036854775806
      responses:
        '202':
          description: Reactivated the failed event and incremented its generation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '200':
          description: No mutation; the same generation was already reactivated and is pending, or the event is processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown event
        '409':
          description: retry_conflict; no matching failed generation or previously applied pending retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Body exceeds 16 KiB
        '415':
          description: Content-Type must be application/json
        '500':
          $ref: '#/components/responses/Failure'
  /v1/customers/{customer_id}/summary:
    get:
      operationId: getSummary
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ID'
      responses:
        '200':
          description: Processed totals only, plus separate pending, failed and processed counts. Unknown customer has zero totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Failure'
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Process responds; not a database check
  /readyz:
    get:
      operationId: ready
      security: []
      responses:
        '200':
          description: Database ping succeeded; not a schema or backlog check
        '503':
          description: Database unavailable or one-second readiness timeout
  /metrics:
    get:
      operationId: metrics
      responses:
        '200':
          description: Fixed-route request counters in Prometheus text format
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Configured internal producer token; grants access to all demo customers
  schemas:
    ID:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'
    Input:
      type: object
      additionalProperties: false
      required: [event_id, customer_id, meter, units]
      properties:
        event_id:
          $ref: '#/components/schemas/ID'
        customer_id:
          $ref: '#/components/schemas/ID'
        meter:
          type: string
          enum: [api_calls]
        units:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
    Event:
      type: object
      required: [event_id, customer_id, meter, units, unit_price_micros, amount_micros, currency, processed, created_at, failed, processing_failures, failure_code, retry_generation]
      properties:
        event_id:
          $ref: '#/components/schemas/ID'
        customer_id:
          $ref: '#/components/schemas/ID'
        meter:
          type: string
          enum: [api_calls]
        units:
          type: integer
          format: int64
        unit_price_micros:
          type: integer
          format: int64
        amount_micros:
          type: integer
          format: int64
        currency:
          type: string
          enum: [USD]
        processed:
          type: boolean
        created_at:
          type: string
          format: date-time
        failed:
          type: boolean
          description: Three integrity failures require manual recovery
        processing_failures:
          type: integer
          minimum: 0
          maximum: 3
          description: Confirmed integrity failures in the active cycle; zero after successful processing
        failure_code:
          type: string
          enum: ['', '23502', '23503', '23505', '23514', '23P01']
          description: Latest allowlisted SQLSTATE; never a raw driver message
        retry_generation:
          type: integer
          format: int64
          minimum: 0
          description: Active queue reactivation generation; zero after successful queue removal
    Summary:
      type: object
      required: [customer_id, currency, units, amount_micros, pending, processed, failed]
      properties:
        customer_id:
          $ref: '#/components/schemas/ID'
        currency:
          type: string
          enum: [USD]
        units:
          type: string
          pattern: '^[0-9]+$'
        amount_micros:
          type: string
          pattern: '^[0-9]+$'
        pending:
          type: integer
          format: int64
        processed:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    Invalid:
      description: Invalid identifier, input, or arithmetic overflow
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or incorrect bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Failure:
      description: Internal failure; retry acceptance only with the same event ID and input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
