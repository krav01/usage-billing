name: Verify Usage Billing

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-quality:
    name: Go quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify module files and formatting
        run: |
          go_version=$(awk '$1 == "go" {print $2}' go.mod)
          for dockerfile in Dockerfile tools/migrate.Dockerfile; do
            grep -Fx "FROM golang:${go_version}-alpine AS build" "$dockerfile"
          done
          go mod tidy
          go mod verify
          git diff --exit-code -- go.mod go.sum
          test -z "$(gofmt -l .)"
      - name: Unit tests with race detector
        run: go test -race -shuffle=on -count=1 -coverprofile=coverage.out ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Measure in-process HTTP handler (not end-to-end throughput)
        run: |
          go version > http-bench.txt
          go test -run='^$' -bench=BenchmarkHTTPHandler -benchmem -count=10 -cpu=1 ./internal/httpapi | tee -a http-bench.txt
      - name: Upload HTTP benchmark samples
        uses: actions/upload-artifact@v7.0.1
        with:
          name: http-bench-${{ github.sha }}
          path: http-bench.txt
          retention-days: 14

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: billing_ci
          POSTGRES_USER: billing_ci
          # Disposable service-container credentials, never a real account.
          POSTGRES_PASSWORD: isolated-ci-database-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billing_ci -d billing_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://billing_ci:isolated-ci-database-only@localhost:5432/billing_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build pinned PostgreSQL-only migration CLI
        run: GOBIN="$RUNNER_TEMP/migration-tools" go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
      - name: Verify migration up, down, and up on disposable database
        run: |
          "$RUNNER_TEMP/migration-tools/migrate" -path migrations -database "$TEST_DATABASE_URL" up
          "$RUNNER_TEMP/migration-tools/migrate" -path migrations -database "$TEST_DATABASE_URL" down 1
          "$RUNNER_TEMP/migration-tools/migrate" -path migrations -database "$TEST_DATABASE_URL" up
      - name: Real PostgreSQL race tests
        run: go test -race -tags=integration -shuffle=on -count=1 -timeout=3m ./...
      - name: Vet integration tests
        run: go vet -tags=integration ./...
      - name: Measure PostgreSQL replay and summary sequentially
        run: |
          go version > postgres-bench.txt
          go test -tags=integration -run='^$' -bench=BenchmarkStore -benchmem -count=10 -cpu=1 -timeout=5m ./internal/postgres | tee -a postgres-bench.txt
      - name: Upload PostgreSQL benchmark samples
        uses: actions/upload-artifact@v7.0.1
        with:
          name: postgres-bench-${{ github.sha }}
          path: postgres-bench.txt
          retention-days: 14

  docker-smoke:
    name: Docker API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Own every container/volume by run; never target the developer demo stack.
      COMPOSE_PROJECT_NAME: usage-billing-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Generate disposable credentials
        run: |
          password=$(openssl rand -hex 24)
          token=$(openssl rand -hex 32)
          grafana_password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "::add-mask::$token"
          echo "::add-mask::$grafana_password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "BILLING_API_TOKEN=$token" >> "$GITHUB_ENV"
          echo "GRAFANA_ADMIN_PASSWORD=$grafana_password" >> "$GITHUB_ENV"
      - name: Build and start isolated local stack
        run: docker compose up -d --build
      - name: Verify authenticated API and restart durability
        shell: bash
        run: |
          set -euo pipefail
          wait_ready() {
            for attempt in $(seq 1 60); do
              if curl -fsS --max-time 2 http://127.0.0.1:8080/readyz >/dev/null; then
                return 0
              fi
              sleep 1
            done
            return 1
          }
          wait_ready
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8080/metrics)
          test "$status" = 401
          body='{"event_id":"ci-event","customer_id":"ci-customer","meter":"api_calls","units":3}'
          status=$(curl -sS --max-time 5 -o /tmp/accepted.json -w '%{http_code}' \
            -H "Authorization: Bearer $BILLING_API_TOKEN" -H 'Content-Type: application/json' \
            --data "$body" http://127.0.0.1:8080/v1/events)
          test "$status" = 202
          jq -e '.amount_micros == 3000 and .unit_price_micros == 1000' /tmp/accepted.json
          for attempt in $(seq 1 60); do
            curl -fsS --max-time 5 -H "Authorization: Bearer $BILLING_API_TOKEN" \
              http://127.0.0.1:8080/v1/customers/ci-customer/summary > /tmp/summary.json
            if jq -e '.processed == 1 and .pending == 0 and .amount_micros == "3000"' /tmp/summary.json; then
              break
            fi
            sleep 1
          done
          jq -e '.processed == 1 and .pending == 0 and .units == "3"' /tmp/summary.json
          curl -fsS --max-time 5 -H "Authorization: Bearer $BILLING_API_TOKEN" \
            http://127.0.0.1:8080/metrics > /tmp/metrics.txt
          grep -Fx 'usage_billing_queue_scrape_success 1' /tmp/metrics.txt
          grep -Fx 'usage_billing_queue_pending_events 0' /tmp/metrics.txt
          grep -Fx 'usage_billing_worker_running 1' /tmp/metrics.txt
          awk '$1 == "usage_billing_worker_events_processed_total" && $2 >= 1 { found = 1 } END { exit !found }' \
            /tmp/metrics.txt
          docker compose restart api
          wait_ready
          status=$(curl -sS --max-time 5 -o /tmp/replayed.json -w '%{http_code}' \
            -H "Authorization: Bearer $BILLING_API_TOKEN" -H 'Content-Type: application/json' \
            --data "$body" http://127.0.0.1:8080/v1/events)
          test "$status" = 200
          jq -e '.processed == true and .amount_micros == 3000' /tmp/replayed.json
          curl -fsS --max-time 5 -H "Authorization: Bearer $BILLING_API_TOKEN" \
            http://127.0.0.1:8080/v1/customers/ci-customer/summary | \
            jq -e '.processed == 1 and .pending == 0 and .amount_micros == "3000"'
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Measure full HTTP, PostgreSQL, and worker path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p load-results
          {
            go version
            uname -sm
            lscpu | grep -E '^(CPU\(s\)|Model name|Thread\(s\) per core|Core\(s\) per socket):'
            docker version --format '{{.Server.Version}}'
            docker compose exec -T postgres postgres --version
            echo 'worker_interval=100ms worker_batch=100 pool_max_connections=8'
            echo '3 sequential runs, 500 new events per run, 8 closed-loop clients, no warmup'
          } > load-results/environment.txt
          go build -o "$RUNNER_TEMP/billing-loadtest" ./cmd/loadtest
          for attempt in 1 2 3; do
            "$RUNNER_TEMP/billing-loadtest" -allow-demo-writes -requests 500 -concurrency 8 \
              > "load-results/run-${attempt}.json"
            jq -c 'del(.successful_acceptance_latencies_ms, .queue_samples)' "load-results/run-${attempt}.json"
          done
      - name: Verify PostgreSQL crash and recovery during a worker transaction
        shell: bash
        run: bash scripts/test-postgres-outage.sh
      - name: Validate and test monitoring alert rules
        run: |
          make monitoring-secrets
          docker compose -f compose.yaml -f compose.monitoring.yaml run --rm --no-deps \
            --entrypoint /bin/promtool prometheus check rules /etc/prometheus/alerts.yml
          make monitoring-test
      - name: Verify local Prometheus and Grafana provisioning
        run: |
          docker compose -f compose.yaml -f compose.monitoring.yaml up -d --no-deps prometheus grafana
          bash scripts/test-monitoring.sh
      - name: Upload full-service load samples
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: full-service-load-${{ github.sha }}
          path: load-results/
          retention-days: 14
      - name: Show bounded diagnostics on failure
        if: failure()
        run: |
          docker compose -f compose.yaml -f compose.monitoring.yaml ps -a
          docker compose -f compose.yaml -f compose.monitoring.yaml logs --no-color --tail=100 api migrate postgres prometheus grafana
      - name: Stop disposable stack
        if: always()
        run: docker compose -f compose.yaml -f compose.monitoring.yaml down --volumes --remove-orphans
