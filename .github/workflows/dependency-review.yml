name: Dependency Review

on:
  pull_request:
    paths-ignore:
      - '.standards.yml'
      - '.github/workflows/standards-drift.yml'
      - '.github/workflows/standards-upgrade.yml'

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          # No automatic comments, write permissions, or unapproved license policy.
          comment-summary-in-pr: never
          license-check: false
          show-openssf-scorecard: false
          retry-on-snapshot-warnings: true
