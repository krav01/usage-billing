name: Publish v0.3.0

on:
  workflow_run:
    workflows: [Verify Usage Billing, CodeQL]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: publish-v0.3.0
  cancel-in-progress: false

jobs:
  publish:
    # Never run privileged code from a PR, fork, or an obsolete default-branch SHA.
    if: >-
      github.repository == 'krav01/usage-billing' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      contains(github.event.workflow_run.head_commit.message, 'from krav01/release/v0.3.0-final') &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publish only the verified v0.3.0 release merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_release.py
