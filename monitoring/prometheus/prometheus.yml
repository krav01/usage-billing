global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: usage-billing
    scrape_timeout: 7s
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/billing_metrics_token
    static_configs:
      - targets: [api:8080]
