version: 1.6.0
maturity: high-load-critical
source: krav01/dev-standards
public_ci_source: krav01/go-ci-standards@8925a43f25bf2af47ff3499a61946a0b07949f2b

controls:
  reusable_ci: false
  standards_drift: true
  standards_auto_upgrade: true
  standards_fast_path: true
  immutable_action_pins: true
  lint: true
  vulncheck: true
  race: true
  database_integration: true
  fuzz: false
  architecture_guard: false
  dependency_review: true
  codeql: true
  dependabot: true
  docker_smoke: true
  performance_benchmarks: true
  migration_roundtrip: true
  backup_restore: true
  failure_recovery: true
  project_memory: true
  memory_freshness: true
  memory_freshness_automation: true
  memory_hotspots: true
  verification_cache: true
  known_traps: true

exceptions:
  - control: reusable_ci
    reason: Existing local verification is materially stricter and includes project-specific formatting, release guards, PostgreSQL integration, benchmarks, Docker smoke, outage recovery, backup restore, schema upgrade, and monitoring validation.
    revisit: Re-evaluate when the public reusable workflow supports project-specific extension without duplicating heavy checks.
  - control: fuzz
    reason: No parser or invariant-heavy surface currently requires a dedicated fuzz gate.
    revisit: Add when parsing or invariant complexity increases.
  - control: architecture_guard
    reason: Current package structure is compact and existing review/tests provide sufficient protection.
    revisit: Add when package boundaries or cross-layer dependencies expand.
